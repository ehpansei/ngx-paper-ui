@if (label()) {
  <label
    class="ui-label"
    [for]="id"
    >{{ label() }}</label
  >
}
<div
  class="ui-control"
  [class.is-error]="!!message()"
  [class.is-disabled]="disabled()">
  <input
    class="ui-input is-mono"
    [id]="id"
    [type]="revealed() ? 'text' : 'password'"
    [value]="value()"
    [readOnly]="readonly()"
    [disabled]="disabled()"
    spellcheck="false"
    [attr.autocomplete]="autocomplete()"
    [attr.name]="name() || null"
    [attr.aria-invalid]="message() ? true : null"
    (input)="value.set($any($event.target).value)"
    (blur)="touched.set(true)" />
  <button
    type="button"
    class="ui-field-btn"
    [attr.aria-pressed]="revealed()"
    [attr.aria-label]="(revealed() ? 'Hide ' : 'Reveal ') + noun()"
    (click)="revealed.set(!revealed())">
    <lib-icon
      [name]="revealed() ? 'eye-off' : 'eye'"
      size="sm" />
  </button>
  @if (copyable()) {
    <button
      type="button"
      class="ui-field-btn"
      [attr.aria-label]="'Copy ' + noun()"
      (click)="copy()">
      <lib-icon
        name="copy"
        size="sm" />
    </button>
  }
</div>
@if (message(); as m) {
  <div class="ui-helper is-error">
    <lib-icon
      name="alert"
      [size]="14" />{{ m }}
  </div>
}
