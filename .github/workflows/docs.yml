name: Docs

# The docs site (apps/ui-demo-app) on GitHub Pages at https://<owner>.github.io/ngx-paper-ui/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx nx build ui-demo-app --base-href /ngx-paper-ui/

      # Pages has no SPA fallback: serve index.html for deep links (/ngx-paper-ui/lib-button).
      - run: cp dist/apps/ui-demo-app/browser/index.html dist/apps/ui-demo-app/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apps/ui-demo-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
